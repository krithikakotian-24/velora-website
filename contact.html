<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Velora</title>

  <!-- Google Analytics code will go here later -->

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="nav"></nav>

  <div class="section">
    <h2>Contact us</h2>
    <p class="sub">Have a question? Send us a message.</p>
    <form class="form" onsubmit="event.preventDefault(); alert('Thank you! We will reply soon.');">
      <input type="text" placeholder="Your name" required>
      <input type="email" placeholder="Your email" required>
      <textarea rows="5" placeholder="Your message" required></textarea>
      <button class="btn" type="submit">Send message</button>
    </form>
  </div>

  <footer>&copy; 2026 Velora. All rights reserved.</footer>

  <script src="products.js"></script>
  <script src="shop.js"></script>

</body>
</html>
